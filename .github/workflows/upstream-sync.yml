name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Casvt/Kapowarr
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: upstream-sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Casvt/Kapowarr.git
          git fetch upstream main

      - name: Check for upstream changes
        id: changes
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already up to date with upstream."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into sync branch
        if: steps.changes.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" origin/main

          if ! git merge --no-edit upstream/main; then
            echo "Upstream changes conflict with this fork. Resolve the conflicts manually before syncing."
            git status --short
            exit 1
          fi

          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Open or update upstream sync pull request
        if: steps.changes.outputs.needed == 'true'
        shell: bash
        run: |
          existing_pr="$(gh pr list \
            --base main \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          body=$(cat <<'EOF'
          Automated sync from `Casvt/Kapowarr:main` into this fork.

          This PR intentionally does not auto-merge. Review the upstream changes and let the normal pull-request test matrix complete before merging.

          If the sync workflow reports a merge conflict, resolve that conflict on this branch manually.
          EOF
          )

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" \
              --title "Sync upstream Casvt/Kapowarr" \
              --body "$body"
            echo "Updated existing PR #$existing_pr"
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream Casvt/Kapowarr" \
              --body "$body"
          fi
