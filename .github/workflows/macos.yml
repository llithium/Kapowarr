name: macOS app

on:
  push:
    branches: [main]
    tags: ['mac-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and verify Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/macos/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r packaging/macos/requirements.txt
      - name: Read app version
        id: version
        run: python -c 'import os, tomllib; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; print(f"version={version}", file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Run backend tests
        run: python -m unittest discover -s tests -p '*.py'
      - name: Build app, ZIP, and DMG
        run: python packaging/macos/build.py
      - name: Verify bundled runtime and app lifecycle
        run: python packaging/macos/smoke_test.py dist/Kapowarr.app
      - name: Verify signature after runtime checks
        run: codesign --verify --deep --strict dist/Kapowarr.app
      - uses: actions/upload-artifact@v4
        with:
          name: Kapowarr-macOS-arm64
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build-logs
          path: build/macos/pyinstaller/server/warn-server.txt

  release:
    name: Publish macOS release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mac-v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kapowarr-macOS-arm64
          path: dist
      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$RELEASE_TAG" = main ]; then
            RELEASE_TAG="mac-v${APP_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" \
              --title "Kapowarr for macOS ($RELEASE_TAG)" \
              --notes "Self-contained Apple Silicon app for macOS 15 or newer. Python and UnRAR are included. Download the DMG, then drag Kapowarr to Applications. This build is ad-hoc signed and is not Apple-notarized. Existing library data stays in Application Support."
          fi
