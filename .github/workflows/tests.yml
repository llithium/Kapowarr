name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pull-request events from GitHub Actions bot commits can produce
    # recursion-suppressed runs with zero jobs and a misleading failure
    # notification, so skip those. Other events (including the
    # workflow_dispatch the upstream sync workflow sends for its PR branch)
    # always run.
    if: ${{ github.event_name != 'pull_request' || github.actor != 'github-actions[bot]' }}
    # Keep Python 3.8/3.9 on an image with compatible setup-python builds.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        name: Set up checkout
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        name: Set up Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install -r requirements.txt
        name: Install dependencies

      - run: |
          mkdir -p db
          python -m unittest discover -s ./tests -p '*.py'
        name: Run Tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m mypy --explicit-package-bases .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/frontend/frontend.test.cjs
