name: Fix Library Import set annotation

on:
  push:
    branches:
      - fix/hidden-sidecars-and-existing-imports

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hidden-sidecars-and-existing-imports
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/features/library_import.py')
          text = p.read_text()
          old = '    skipped_existing_groups: Set[int] = set()'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '    skipped_existing_groups = set()', 1))
          PY
          rm .github/workflows/fix-library-import-set.yml
      - name: Test
        run: |
          pip install -r requirements.txt
          mkdir -p db
          python -m unittest discover -s ./tests -p '*.py'
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix Library Import set annotation for Python 3.8'
          git push origin HEAD:fix/hidden-sidecars-and-existing-imports
