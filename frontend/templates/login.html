<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta id="url_base" data-value="{{url_base}}">
	{% include 'desktop_session.html' %}

	<link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/x-icon">

	<link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/workspace.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
	<script src="{{ url_for('static', filename='js/storage.js') }}"></script>
	<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
	<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>

	<title>Login - Kapowarr</title>
</head>
<body class="login-page">
	<main class="login-card">
		<div id="text-container">
			<img src="{{ url_for('static', filename='img/favicon.svg') }}" alt="">
			<h1>Kapowarr</h1>
			<p>Your comic library, organized.</p>
		</div>
		<noscript>
			This page needs JavaScript to sign you in.
		</noscript>
		<form id="login-form" class="hidden">
			<p id="error-message" class="error hidden" role="alert">That username and password don't match.</p>
			<div class="input-container">
				<label for="username-input">Username</label>
				<input type="text" id="username-input" autocomplete="username" autofocus required>
			</div>
			<div class="input-container">
				<label for="password-input">Password</label>
				<input type="password" id="password-input" autocomplete="current-password" required>
			</div>
			<button type="submit">Sign in</button>
		</form>
	</main>
</body>
</html>
