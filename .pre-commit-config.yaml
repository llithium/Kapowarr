repos:
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort

-   repo: https://github.com/hhatto/autopep8
    rev: v2.2.0
    hooks:
    -   id: autopep8

# Runtime checks use the activated development environment installed from
# requirements-dev.txt, which includes the canonical runtime requirements.
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        language: system
        types: [python]
        pass_filenames: false
        entry: python -m mypy --explicit-package-bases .
    -   id: unittest
        name: unittest
        language: system
        types: [python]
        pass_filenames: false
        entry: python -m unittest discover -s ./tests -p '*.py'
    -   id: frontend-tests
        name: frontend tests
        language: system
        files: ^(frontend/|tests/frontend/)
        pass_filenames: false
        entry: node --test tests/frontend/frontend.test.cjs
